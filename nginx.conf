# Reverse proxy de produccion. Storefront en / y backend Medusa en sus rutas.
upstream storefront_up {
    server storefront:8000;
}
upstream medusa_up {
    server medusa:9001;
}

server {
    listen 80;
    server_name _;

    # Tamaño de subida (imagenes de producto desde el admin)
    client_max_body_size 20m;

    # API de tienda, autenticacion, panel admin y health -> Medusa
    location /store/   { proxy_pass http://medusa_up; }
    location /admin/   { proxy_pass http://medusa_up; }
    location /auth/    { proxy_pass http://medusa_up; }
    location /app      { proxy_pass http://medusa_up; }
    location /health   { proxy_pass http://medusa_up; }

    # Todo lo demas -> storefront Next.js
    location / {
        proxy_pass http://storefront_up;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
