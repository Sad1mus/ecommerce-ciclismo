name: CI

# Red de seguridad: en cada push a develop (y en PRs) corre los tests unitarios
# del bot (con mocks, sin red) y el build del storefront (sin backend). NO usa
# secretos: los tests de integración pesados quedan fuera (marker `integration`,
# excluido por defecto en pytest.ini) y el build degrada a páginas dinámicas si
# no hay backend (generateStaticParams devuelve []).
on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bot-tests:
    name: Bot — pytest (unitarios, mocks)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/bot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: src/bot/requirements-dev.txt
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: pytest (excluye integration por pytest.ini)
        run: python -m pytest -q

  storefront-build:
    name: Storefront — next build (sin backend)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/storefront
    env:
      # check-env-variables.js exige esta key; valor ficticio (no es secreto).
      NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY: pk_ci_dummy_key_for_build_only
      NEXT_PUBLIC_DEFAULT_REGION: co
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: src/storefront/package-lock.json
      - name: Instalar dependencias
        run: npm ci
      - name: next build
        run: npm run build
