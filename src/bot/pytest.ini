[pytest]
# Los tests marcados 'integration' corren contra el stack REAL (Medusa vivo en
# :9001) y se EXCLUYEN por defecto, para que `pytest` (unitarios con mocks) quede
# verde en CI sin necesidad de levantar el backend.
# Correr la integración explícitamente:  python -m pytest -q -m integration
markers =
    integration: corre contra el stack REAL (Medusa vivo); requiere MEDUSA_* en entorno
addopts = -m "not integration"
